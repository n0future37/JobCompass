[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "jobcompass"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2,<3", "alembic", "pymysql", "pymilvus", "redis", "httpx", "numpy", "torch==2.14.1", "transformers==5.18.0", "langchain==1.4.8", "langgraph==1.2.19", "pypdf==6.21.4", "pyyaml"]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: real isolated MySQL Redis Milvus services"]
[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["src/jobcompass/crawlers"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
